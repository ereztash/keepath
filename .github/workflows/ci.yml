name: CI

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: build-time-placeholder
          GOOGLE_CLIENT_ID: build-time-placeholder
          GOOGLE_CLIENT_SECRET: build-time-placeholder
          ANTHROPIC_API_KEY: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000

  # E2E tests are deferred until proper Google OAuth mocking is in place.
  # The Playwright config and demo-flow spec live in apps/web/ for local use:
  #   cd apps/web && npm run test:e2e:headed

